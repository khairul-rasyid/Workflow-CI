name: CI Workflow - MLflow & Docker

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  train-and-build:
    runs-on: ubuntu-latest

    steps:
      # 1. Set up job & Checkout repository
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      # 2. Set up Python
      - name: Set up Python 3.12.7
        uses: actions/checkout@v3
        with:
          python-version: "3.12.7"

      # 3. Check Env
      - name: Check Env
        run: |
          python --version
          pip --version

      # 4. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow tensorflow scikit-learn matplotlib cloudpickle

      # 5. Set MLflow Tracking URI (Local artifacts)
      - name: Set MLflow Tracking URI
        run: |
          echo "MLFLOW_TRACKING_URI=file://${{ github.workspace }}/mlruns" >> $GITHUB_ENV

      # 6. Run mlflow project
      - name: Run mlflow project
        run: |
          mlflow run MLProject --no-conda

      # 7. Get latest MLflow run_id
      - name: Get latest MLflow run_id
        id: get_run_id
        run: |
          RUN_ID=$(cat MLProject/last_run_id.txt)
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "MLflow Run ID: $RUN_ID"

      # 8. Install Python dependencies (pemasangan pendukung bila diperlukan)
      - name: Install Python dependencies
        run: |
          pip install wheel

      # 9. Upload Artifacts (Pengganti Google Drive: Simpan Artefak ke GitHub Artifacts)
      - name: Upload to Artifacts Repository
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: mlruns/

      # 10. Build Docker Model menggunakan mlflow build-docker
      - name: Build Docker Model
        run: |
          mlflow models build-docker -m "mlruns/0/${{ env.RUN_ID }}/artifacts/model" -n "animal-classification-model" --enable-mlserver

      # 11. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 12. Tag Docker Image
      - name: Tag Docker Image
        run: |
          docker tag animal-classification-model:latest ${{ secrets.DOCKERHUB_USERNAME }}/animal-classification-model:latest

      # 13. Push Docker Image
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/animal-classification-model:latest