name: CI Workflow - MLflow & Docker

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  train-and-build:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Memberikan izin push ke repo

    steps:
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Check Env
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<2.0" "tensorflow==2.18.0" "mlflow==2.19.0" scikit-learn matplotlib cloudpickle mlserver mlserver-mlflow

      - name: Set MLflow Tracking URI
        run: |
          echo "MLFLOW_TRACKING_URI=file://${{ github.workspace }}/mlruns" >> $GITHUB_ENV

      - name: Run mlflow project
        run: |
          mlflow run MLProject --env-manager local

      - name: Get latest MLflow run_id
        id: get_run_id
        run: |
          RUN_ID=$(cat MLProject/last_run_id.txt)
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "MLflow Run ID: $RUN_ID"

      # === TAHAP TAMBAHAN: COMMIT & PUSH ARTEFAK KE GITHUB REPOSITORY ===
      - name: Save Artifacts to GitHub Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Tambahkan folder artefak dan mlruns ke git tracking
          git add -f mlruns/ artifacts/ MLProject/last_run_id.txt || true
          
          # Lakukan commit jika ada perubahan file
          if ! git diff --staged --quiet; then
            git commit -m "chore(ci): auto-save MLflow artifacts for run ${{ env.RUN_ID }} [skip ci]"
            git push origin main
          else
            echo "Tidak ada perubahan artefak untuk di-commit."
          fi

      - name: Install Python dependencies
        run: |
          pip install wheel

      - name: Build Docker Model
        run: |
          # 1. Cari lokasi paket MLflow di site-packages dan ubah template python3.9 ke python3.10
          MLFLOW_PATH=$(python -c "import mlflow, os; print(os.path.dirname(mlflow.__file__))")
          echo "Patching MLflow template at $MLFLOW_PATH"
          find "$MLFLOW_PATH" -type f \( -name "*.py" -o -name "Dockerfile*" \) -exec sed -i 's/python3.9/python3.10/g' {} +

          # 2. Jalankan perintah asli mlflow models build-docker sesuai kriteria
          mlflow models build-docker -m "mlruns/0/${{ env.RUN_ID }}/artifacts/model" -n "5_animal_classification" --enable-mlserver

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag 5_animal_classification:latest ${{ secrets.DOCKERHUB_USERNAME }}/5_animal_classification:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/5_animal_classification:latest